# ========== 暑假作业打卡系统（summer-homework-checkin） ==========
# 子路径 /homework/ → hanghang-net 网络内容器 summer-homework:8000
# 通用请求头/上传限制/缓存已在 default.conf 的 server 级统一配置
# 写法说明：proxy_pass 使用变量触发运行时 DNS 解析（配合 default.conf 的 resolver），
# 后端未启动时 nginx 仍可正常启动；子路径前缀由 rewrite 剔除

location /homework/ {
    set $homework_upstream summer-homework;
    rewrite ^/homework/(.*)$ /$1 break;
    proxy_pass http://$homework_upstream:8000;
}

# 无斜杠访问时规范化跳转
location = /homework {
    return 301 /homework/;
}
