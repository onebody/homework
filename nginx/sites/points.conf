# ========== 打卡积分兑换系统（points-system） ==========
# 子路径 /points/ → hanghang-net 网络内容器 points-system:8000
# 通用请求头/上传限制/缓存已在 default.conf 的 server 级统一配置
# 写法说明：proxy_pass 使用变量触发运行时 DNS 解析（配合 default.conf 的 resolver），
# 后端未启动时 nginx 仍可正常启动；子路径前缀由 rewrite 剔除

location /points/ {
    set $points_upstream points-system;
    rewrite ^/points/(.*)$ /$1 break;
    proxy_pass http://$points_upstream:8000;
}

# 无斜杠访问时规范化跳转
location = /points {
    return 301 /points/;
}
