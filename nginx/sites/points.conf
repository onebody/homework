# ========== 打卡积分兑换系统（points-system） ==========
# 安全决策（2026-07）：points-system 后端 12 个接口均无认证，经本路由公网暴露
# 等于任何人可匿名读写积分数据，故撤销公网暴露，统一返回 403。
# 如需本地调试：容器端口已绑定 127.0.0.1:8001，宿主机直连
#   curl http://127.0.0.1:8001/
# 恢复公网暴露前，必须先给 points-system 后端加上认证层。

location /points/ {
    charset utf-8;
    return 403 "积分系统已停止公网访问（后端接口无认证，暴露即数据泄露）";
}

# 无斜杠访问同样拒绝
location = /points {
    charset utf-8;
    return 403 "积分系统已停止公网访问（后端接口无认证，暴露即数据泄露）";
}
