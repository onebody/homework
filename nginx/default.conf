# ============================================================================
# 本地 Docker 测试环境 —— 通用 Nginx 反向代理（独立编排，workspace 级共享）
#
# 结构说明（新项目接入无需修改本文件）：
#   nginx/docker-compose.yml  独立编排：单独启停，不依赖应用服务
#   nginx/default.conf        本文件：通用设置（上传限制/缓存/请求头）+ 统一 server
#   nginx/sites/*.conf        各项目的 location 路由片段，一个项目一个文件
#
# 新项目接入步骤：
#   1. 应用服务加入外部共享网络 hanghang-net（无需暴露端口）
#   2. 在 nginx/sites/ 下新建 <项目名>.conf，使用变量 + rewrite 写法（参考现有片段），
#      保证后端未启动时 nginx 仍可正常启动
#   3. docker exec local-nginx nginx -s reload
# ============================================================================

# 静态资源缓存策略（js/css/图片按扩展名区分，对所有项目生效）
map $uri $static_cache_control {
    ~*\.(js|css)$                          "public, max-age=3600";
    ~*\.(png|jpe?g|gif|webp|svg|ico)$      "public, max-age=86400";
    default                                "";
}

server {
    listen 80 default_server;
    server_name _;

    # Docker 内置 DNS：配合 sites 片段中“变量 + proxy_pass”写法实现运行时解析，
    # 后端容器不在线时 nginx 仍能正常启动（对应路径返回 502）
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 文件上传大小上限（全站通用；与各应用 10MB 级别的限制匹配并留余量）
    client_max_body_size 12m;

    # 通用代理请求头（server 级定义，所有 location 自动继承）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 静态资源缓存头（空值时不输出）
    add_header Cache-Control $static_cache_control;

    # 根路径导航页（列出已接入的项目入口）
    location = / {
        default_type text/html;
        return 200 '<html><body><h3>本地测试环境</h3><ul><li><a href="/homework/">暑假作业学生端</a></li><li><a href="/homework/admin/">暑假作业管理端</a></li></ul></body></html>';
    }

    # 加载各项目的路由片段（每个项目一个文件，互不影响）
    include /etc/nginx/sites/*.conf;
}
